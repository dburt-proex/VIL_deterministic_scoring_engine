version: '0.1'
system: VIL
repository: dburt-proex/VIL_deterministic_scoring_engine
canonical_registry: dburt-proex/casa/governance/CONTROL-REGISTRY.yaml
canonical_registry_version: '0.1'
claim_boundary: no_certification_or_attestation_claim_without_independent_assurance
assessment_date: '2026-08-16'
states: [NOT_APPLICABLE, MISSING, PARTIAL, IMPLEMENTED, VERIFIED]
controls:
  GOV-001:
    status: PARTIAL
    evidence: [README.md, app, .claude]
    gap: Deterministic routing and agent constraints exist, but canonical organizational governance and approval authority are external.
  RSK-001:
    status: IMPLEMENTED
    evidence: [README.md, app, tests]
    note: Signal value, verifiability and critical-risk override logic are implemented for VIL scope; broader enterprise treatment remains external.
  IAM-001:
    status: MISSING
    evidence: []
    gap: README explicitly identifies authentication as a paid-deployment hardening requirement.
  CHG-001:
    status: PARTIAL
    evidence: [.claude/hooks/block-destructive.sh, .claude/agents, tests]
    gap: Local agent/change safeguards exist; canonical PR/change-control evidence is incomplete.
  LOG-001:
    status: IMPLEMENTED
    evidence: [README.md, app]
    note: Persistent JSONL audit decisions and audit API are part of the current system contract.
  EVD-001:
    status: IMPLEMENTED
    evidence: [README.md, app, tests]
    note: Verifiability caps score and a signal cannot outrank its evidence.
  SEC-001:
    status: PARTIAL
    evidence: [.claude/agents/security-reviewer.md, .claude/hooks/block-destructive.sh, app, tests]
    gap: Security review primitives exist; formal threat model and independent assessment are not evidenced.
  INC-001:
    status: MISSING
    evidence: []
    gap: No full incident-response lifecycle.
  AI-001:
    status: PARTIAL
    evidence: [README.md, app, tests]
    gap: AI-assisted signal scoring/evaluation exists, but full AI inventory/lifecycle/TEVV/monitoring/decommissioning is not established.
  DAT-001:
    status: MISSING
    evidence: []
    gap: No canonical data inventory, classification, retention, deletion and handling policy; tenant-level storage is also pending hardening.
  SUP-001:
    status: MISSING
    evidence: []
    gap: No supplier/model-provider inventory and risk-review process.
  BCM-001:
    status: MISSING
    evidence: []
    gap: No backup/restore/RTO/RPO policy or tested recovery evidence.
  REV-001:
    status: PARTIAL
    evidence: [tests, .claude/agents/test-verifier.md]
    gap: Testing exists; recurring internal audit and management review are not formalized.
remediation:
  p0: [IAM-001, INC-001, DAT-001, SUP-001, BCM-001]
  p1: [GOV-001, CHG-001, SEC-001, AI-001, REV-001]
  external_assurance_gate: blocked_until_p0_closed_or_formally_risk_accepted
